[package]
name = "spore-print"
version = "0.1.1"
authors = ["Hakim Jonas Ghoula <hakim@walkthisway.dk>"]
edition = "2021"
description = "A Rust library providing a SporePrint trait and derive macro for immutable string representations."
license = "MIT"
repository = "https://github.com/fungal-lang/spore-print"
readme = "README.md"


[dependencies]
phf = { version = "0.11", features = ["macros"] }
[dev-dependencies]
spore-print-derive = { path = "../spore-print-derive" }
